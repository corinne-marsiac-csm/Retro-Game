        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'float': 'floatAnimation 3s ease-in-out infinite',
                        'shadow': 'shadowPulse 3s ease-in-out infinite',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        floatAnimation: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        shadowPulse: {
                            '0%, 100%': { transform: 'translateX(-50%) scale(1)', opacity: '0.5' },
                            '50%': { transform: 'translateX(-50%) scale(0.6)', opacity: '0.2' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%': { transform: 'translateX(-10px)' },
                            '40%': { transform: 'translateX(10px)' },
                            '60%': { transform: 'translateX(-10px)' },
                            '80%': { transform: 'translateX(10px)' },
                        }
                    }
                }
            }
        }

        // --- SOUND ENGINE ---
        const playSound = (type, muted) => {
          if (muted) return;

          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;

            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.connect(gain);
            gain.connect(ctx.destination);

            const now = ctx.currentTime;

            switch (type) {
              case "boot":
                osc.type = "square";
                osc.frequency.setValueAtTime(1046, now);
                osc.frequency.exponentialRampToValueAtTime(2093, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                osc.start(now);
                osc.stop(now + 1.5);
                break;

              case "select":
                osc.type = "square";
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.stop(now + 0.1);

            ],
            medium: [
              "Bonne intention, mais il faut être plus concret sur le mécanisme",
              "Il manque un élément de preuve ou de vocabulaire exact",
              "Réponse OK, mais améliorable pour une audience exigeante",
            ],
            high: [
              "Le manque de précision peut créer des objections difficiles à lever",
              "À ce niveau, une mauvaise formulation peut bloquer le projet",
              "Il faut sécuriser le discours, surtout sur la confiance et la data",
            ],
          };

          const baseSeed =
            (scenarioId?.length || 0) +
            (missionIndex + 1) * 7 +
            (risk === "low" ? 3 : risk === "medium" ? 5 : 11);

          const consequence = isAgent
            ? pick(consequencesAgent[risk], baseSeed)
            : pick(consequencesCSM[risk], baseSeed);

          const coach = isAgent
            ? pick(analysisAgent[risk], baseSeed + 2)
            : pick(analysisCSM[risk], baseSeed + 2);

          return {
            consequence: `${consequence}.`,
            score1_impact: rule.s1,
            score2_impact: rule.s2,
            coach_analysis: `${coach}.`,
            final_score: rule.final,
            meta: { labelS1, labelS2 },
          };
        };

        const App = () => {
          // États du jeu
          const [isLocked, setIsLocked] = useState(true);
          const [passwordInput, setPasswordInput] = useState("");
          const [showPassword, setShowPassword] = useState(false);
          const [isShaking, setIsShaking] = useState(false);

          const [gameState, setGameState] = useState("off");
          const [currentGameType, setCurrentGameType] = useState(null);
          const [currentMissionIndex, setCurrentMissionIndex] = useState(0);

          const [stats, setStats] = useState({ score1: 50, score2: 50 });
          const [feedback, setFeedback] = useState(null);
          const [loading, setLoading] = useState(false);

          const [menuIndex, setMenuIndex] = useState(0);
          const [choiceIndex, setChoiceIndex] = useState(0);
          const [muted, setMuted] = useState(false);

          const play = useCallback((type) => playSound(type, muted), [muted]);

          const missions = useMemo(() => {
            if (!currentGameType) return [];
            return currentGameType === "csm" ? CSM_SCENARIOS : AGENT_MISSIONS;
          }, [currentGameType]);

          const labels = useMemo(() => {
            if (!currentGameType) return { s1: "HP", s2: "CONF" };
            return currentGameType === "agent" ? { s1: "TRUST", s2: "ADOPT" } : { s1: "HP", s2: "CONF" };
          }, [currentGameType]);

          const getSafeScore = () => {
            const avg = Math.round((stats.score1 + stats.score2) / 2);
            return Number.isFinite(avg) ? avg : 0;
          };

          const getCurrentScenario = useCallback(() => {
            if (!currentGameType) return null;
            const list = currentGameType === "csm" ? CSM_SCENARIOS : AGENT_MISSIONS;
            return list[currentMissionIndex] || null;
          }, [currentGameType, currentMissionIndex]);

          const handleUnlock = (e) => {
            e.preventDefault();
            if (passwordInput.toLowerCase() === "crashbandicoot") {
              play("confirm");
              setIsLocked(false);
              setGameState("boot");
            } else {
              play("gameover_bad");
              setIsShaking(true);
              setTimeout(() => setIsShaking(false), 500);
              setPasswordInput("");
            }
          };

          useEffect(() => {
            if (gameState === "boot") {
              play("boot");
              const timer = setTimeout(() => setGameState("avatar"), 2500);
              return () => clearTimeout(timer);
            }
            if (gameState === "avatar") {
              const timer = setTimeout(() => setGameState("game_select"), 4000);
              return () => clearTimeout(timer);
            }
            if (gameState === "game_intro") {
              const timer = setTimeout(() => setGameState("playing"), 2500);
              return () => clearTimeout(timer);
            }
          }, [gameState, play]);

          const handlePower = () => {
            if (gameState === "off") {
              setGameState("boot");
            } else {
              setGameState("off");
              setCurrentGameType(null);
              setFeedback(null);
              setMenuIndex(0);
              setChoiceIndex(0);
              setCurrentMissionIndex(0);
              setStats({ score1: 50, score2: 50 });
            }
          };

          const startGame = useCallback(
            (type) => {
              play("confirm");
              setCurrentGameType(type);
              setCurrentMissionIndex(0);
              setStats({ score1: 0, score2: 0 });
              setChoiceIndex(0);
              setFeedback(null);
              setGameState("game_intro");
            },
            [play]
          );

          const handleChoice = useCallback(
            async (choice) => {
              play("confirm");
              setLoading(true);

              try {
                const scenario = getCurrentScenario();
                const data = buildFeedback({
                  gameType: currentGameType,
                  scenarioId: scenario?.id || "unknown",
                  risk: choice?.risk || "medium",
                  missionIndex: currentMissionIndex,
                });

                setStats((prev) => ({
                  score1: Math.max(0, Math.min(100, prev.score1 + (Number(data.score1_impact) || 0))),
                  score2: Math.max(0, Math.min(100, prev.score2 + (Number(data.score2_impact) || 0))),
                }));

                setFeedback(data);
                play("success");
                setGameState("result");
              } catch (err) {
                console.error(err);
                setFeedback({
                  consequence: "Erreur interne. Le simulateur redémarre.",
                  score1_impact: 0,
                  score2_impact: 0,
                  coach_analysis: "Relance l'app et réessaie.",
                  final_score: 0,
                  meta: { labelS1: "HP", labelS2: "CONF" },
                });
                setGameState("result");
              } finally {
                setLoading(false);
              }
            },
            [currentGameType, currentMissionIndex, getCurrentScenario, play]
          );

          const nextStep = useCallback(() => {
            const list = currentGameType === "csm" ? CSM_SCENARIOS : AGENT_MISSIONS;

            if (currentMissionIndex < list.length - 1) {
              play("confirm");
              setCurrentMissionIndex((prev) => prev + 1);
              setFeedback(null);
              setChoiceIndex(0);
              setGameState("playing");
            } else {
              const avgScore = getSafeScore();
              if (avgScore > 75) play("gameover_good");
              else if (avgScore < 40) play("gameover_bad");
              else play("success");
              setGameState("game_over");
            }
          }, [currentGameType, currentMissionIndex, play, stats]);

          const backToMenu = useCallback(() => {
            play("back");
            setGameState("game_select");
            setMenuIndex(0);
            setCurrentGameType(null);
            setFeedback(null);
            setChoiceIndex(0);
            setCurrentMissionIndex(0);
            setStats({ score1: 50, score2: 50 });
          }, [play]);

          const handleNav = useCallback(
            (direction) => {
              play("select");

              if (gameState === "game_select") {
                if (direction === "up" || direction === "down") {
                  setMenuIndex((prev) => (prev === 0 ? 1 : 0));
                }
              } else if (gameState === "playing") {
                const scenario = getCurrentScenario();
                if (!scenario) return;

                const max = scenario.choices.length - 1;
                if (direction === "up") setChoiceIndex((prev) => (prev > 0 ? prev - 1 : max));
                if (direction === "down") setChoiceIndex((prev) => (prev < max ? prev + 1 : 0));
              }
            },
            [gameState, play, getCurrentScenario]
          );

          const handleA = useCallback(() => {
            if (gameState === "game_select") {
              if (menuIndex === 0) startGame("csm");
              else startGame("agent");
            } else if (gameState === "playing") {
              const scenario = getCurrentScenario();
              if (scenario && !loading) {
                handleChoice(scenario.choices[choiceIndex]);
              }
            } else if (gameState === "result") {
              nextStep();
            } else if (gameState === "game_over") {
              backToMenu();
            } else if (gameState === "avatar") {
              setGameState("game_select");
            }
          }, [
            gameState,
            menuIndex,
            choiceIndex,
            loading,
            handleChoice,
            nextStep,
            backToMenu,
            startGame,
            getCurrentScenario,
          ]);

          const handleB = useCallback(() => {
            if (gameState === "playing" || gameState === "result" || gameState === "game_over") {
              backToMenu();
            }
          }, [gameState, backToMenu]);

          useEffect(() => {
            const handleKeyDown = (e) => {
              if (isLocked) return;
              if (gameState === "off") return;

              switch (e.key) {
                case "ArrowUp": e.preventDefault(); handleNav("up"); break;
                case "ArrowDown": e.preventDefault(); handleNav("down"); break;
                case "ArrowLeft": e.preventDefault(); handleNav("left"); break;
                case "ArrowRight": e.preventDefault(); handleNav("right"); break;
                case "Enter": handleA(); break;
                case "a": handleA(); break;
                case "Backspace": handleB(); break;
                case "Escape": handleB(); break;
                case "b": handleB(); break;
                default: break;
              }
            };

            window.addEventListener("keydown", handleKeyDown);
            return () => window.removeEventListener("keydown", handleKeyDown);
          }, [gameState, handleNav, handleA, handleB, isLocked]);

          if (isLocked) {
            return (
              <div className="min-h-screen bg-[#0f0518] flex items-center justify-center p-4 font-mono select-none">
                <div className={`relative w-full max-w-md bg-[#2e004b] p-8 rounded border-4 border-[#6d28d9] shadow-[0_0_50px_rgba(139,92,246,0.3)] flex flex-col items-center ${isShaking ? "animate-shake" : ""}`}>
                  <div className="absolute inset-0 pointer-events-none z-10 opacity-20" style={{ background: "linear-gradient(transparent 50%, black 50%)", backgroundSize: "100% 4px" }}></div>
                  <div className="z-20 w-full flex flex-col items-center">
                    <Lock className="w-16 h-16 text-[#e9d5ff] mb-6 animate-pulse" />
                    <h1 className="text-2xl sm:text-3xl font-black text-[#e9d5ff] tracking-[0.2em] mb-2 text-center uppercase drop-shadow-md">Password<br />Required</h1>
                    <div className="w-full h-1 bg-[#6d28d9] my-6"></div>
                    <form onSubmit={handleUnlock} className="w-full flex flex-col gap-4">
                      <label className="text-[#c4b5fd] font-bold text-xs uppercase tracking-widest text-center">Enter Password:</label>
                      <div className="relative w-full">
                        <input
                          type={showPassword ? "text" : "password"}
                          value={passwordInput}
                          onChange={(e) => setPasswordInput(e.target.value)}
                          className="w-full bg-[#e9d5ff] text-[#2e004b] p-4 font-black text-center text-lg uppercase tracking-widest outline-none border-4 border-[#6d28d9] focus:border-[#c4b5fd] transition-all placeholder-[#6d28d9]/50 shadow-inner"
                          placeholder="PASSWORD"
                          autoFocus
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-4 top-1/2 -translate-y-1/2 text-[#6d28d9] hover:text-[#2e004b] focus:outline-none transition-colors"
                          tabIndex={-1}
                        >
                          {showPassword ? <EyeOff size={20} /> : <Eye size={20} />}
                        </button>
                      </div>
                      <button type="submit" className="bg-[#6d28d9] text-[#e9d5ff] py-4 font-black uppercase tracking-widest hover:bg-[#5b21b6] hover:scale-[1.02] transition-all border-2 border-transparent active:border-[#e9d5ff] shadow-lg mt-2">Unlock Console</button>
                    </form>
                    <div className="mt-8 text-center opacity-70">
                      <span className="text-[#c4b5fd] text-[10px] font-bold animate-pulse">&gt; WAITING FOR AUTHORIZATION_</span>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          const AvatarScreen = () => (
            <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#9bbc0f] z-10 overflow-hidden">
                {/* Contenu SVG de l'intro inchangé */}
                <div className="relative mb-4">
                    <div className="absolute -bottom-4 left-1/2 w-16 h-3 bg-[#306230] rounded-full opacity-50 blur-[1px] animate-shadow"></div>
                    <div className="animate-float">
                    <svg width="120" height="120" viewBox="0 0 100 100" className="drop-shadow-sm">
                        <circle cx="50" cy="50" r="40" fill="#9bbc0f" stroke="#0f380f" strokeWidth="3" />
                        <ellipse cx="28" cy="55" rx="6" ry="3" fill="#8bac0f" stroke="none" />
                        <ellipse cx="72" cy="55" rx="6" ry="3" fill="#8bac0f" stroke="none" />
                        <ellipse cx="38" cy="40" rx="3" ry="8" fill="#0f380f" />
                        <ellipse cx="62" cy="40" rx="3" ry="8" fill="#0f380f" />
                        <circle cx="37" cy="36" r="1.5" fill="#9bbc0f" />
                        <circle cx="63" cy="36" r="1.5" fill="#9bbc0f" />
                        <path d="M 47 60 Q 50 63 53 60" stroke="#0f380f" strokeWidth="2" fill="none" strokeLinecap="round" />
                        <ellipse cx="25" cy="85" rx="12" ry="7" fill="#306230" stroke="#0f380f" strokeWidth="2" transform="rotate(-15 25 85)" />
                        <ellipse cx="75" cy="85" rx="12" ry="7" fill="#306230" stroke="#0f380f" strokeWidth="2" transform="rotate(15 75 85)" />
                        <path d="M 10 45 Q 2 30 18 25" stroke="#0f380f" strokeWidth="2" fill="#9bbc0f" strokeLinecap="round" />
                        <path d="M 90 45 Q 98 30 82 25" stroke="#0f380f" strokeWidth="2" fill="#9bbc0f" strokeLinecap="round" />
                    </svg>
                    </div>
                </div>
                <div className="mt-8 text-[#0f380f] font-black text-xs uppercase tracking-widest text-center leading-relaxed z-20">Corinne&apos;s<br />Dreamland</div>
                <div className="absolute bottom-2 text-[#306230] text-[8px] font-bold">Retro Mode</div>
            </div>
          );

          const GameOverScreen = () => {
            const avgScore = getSafeScore();
            let mood = "neutral";
            let title = "MISSION COMPLETE";
            if (avgScore < 40) { mood = "bad"; title = "GAME OVER"; } 
            else if (avgScore > 75) { mood = "good"; title = "LEGENDARY!"; }

            return (
              <div className="absolute inset-0 flex flex-col items-center justify-between p-6 bg-[#9bbc0f] z-20">
                <div className="text-center w-full border-b-2 border-[#0f380f] pb-2">
                  <h2 className="text-xl font-black text-[#0f380f] tracking-tighter animate-pulse">{title}</h2>
                  <p className="text-xs font-bold text-[#306230]">SCORE: {avgScore}/100</p>
                </div>
                <div className="flex-1 flex items-center justify-center w-full relative">
                    {/* SVG simplifié pour l'exemple, reprendre le SVG complet si nécessaire */}
                    <svg width="140" height="140" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="#9bbc0f" stroke="#0f380f" strokeWidth="3" />
                    </svg>
                </div>
                <div className="w-full space-y-2">
                  <div className="text-[10px] text-center font-bold mb-4">
                    {mood === "bad" && "Keep improving. Try again"}
                    {mood === "neutral" && "Good progress. Keep refining."}
                    {mood === "good" && "You are a SaaS Legend!"}
                  </div>
                  <button onClick={backToMenu} onMouseEnter={() => play("select")} className="w-full bg-[#0f380f] text-[#9bbc0f] text-xs font-black py-3 shadow-[2px_2px_0px_rgba(0,0,0,0.3)] hover:translate-y-[1px] hover:shadow-none transition-all uppercase">Return to Menu (Press A)</button>
                </div>
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-zinc-200 flex items-center justify-center p-2 sm:p-6 font-mono select-none">
              <div className="relative w-full max-w-[600px] bg-[#D1D1D1] rounded-[30px] rounded-br-[80px] sm:rounded-br-[120px] p-6 sm:p-10 shadow-[10px_10px_0px_rgba(0,0,0,0.15)] border-t-2 border-l-4 border-white/50 overflow-visible transform transition-transform duration-300">
                <div className="relative bg-[#555] rounded-t-xl rounded-b-[40px] shadow-inner mb-8 sm:mb-12 border-b-4 border-r-4 border-[#444] px-8 py-8 sm:px-12 sm:py-12">
                  <div className="absolute top-3 left-0 w-full text-center flex justify-between px-8 sm:px-12 pointer-events-none">
                    <div className="h-[2px] bg-[#333] w-1/3 mt-1.5 opacity-50"></div>
                    <div className="text-[6px] sm:text-[7px] text-zinc-800 font-bold uppercase tracking-widest leading-tight mx-2 opacity-60">DOT MATRIX WITH STEREO SOUND</div>
                    <div className="h-[2px] bg-[#333] w-1/3 mt-1.5 opacity-50"></div>
                  </div>
                  <div className="absolute top-1/2 left-2 sm:left-3 -translate-y-1/2 flex flex-col gap-4 items-center z-20 w-6">
                    <div className="flex flex-col gap-1 items-center">
                      <div className={`w-2 h-2 rounded-full transition-colors duration-300 ${gameState === "off" ? "bg-[#444]" : "bg-red-500 animate-pulse shadow-[0_0_5px_red]"}`}></div>
                      <span className="text-[5px] sm:text-[6px] text-zinc-400 font-bold uppercase tracking-widest hidden sm:block rotate-90 sm:rotate-0 mt-1 sm:mt-0">BATTERY</span>
                    </div>
                    <button onClick={() => setMuted(!muted)} className="text-zinc-400 hover:text-white transition-colors" title="Mute Sound">{muted ? <VolumeX size={10} /> : <Volume2 size={10} />}</button>
                  </div>
                  <div className={`relative w-full aspect-[10/9] overflow-hidden rounded-md transition-all duration-500 shadow-[inset_0_0_20px_rgba(0,0,0,0.5)] border-4 border-zinc-700 ${gameState === "off" ? "bg-[#2a2a2a]" : "bg-[#9bbc0f]"}`}>
                    {gameState !== "off" && gameState !== "avatar" && (
                      <div className="absolute inset-0 pointer-events-none z-10 opacity-10" style={{ background: "linear-gradient(transparent 50%, black 50%)", backgroundSize: "100% 4px" }}></div>
                    )}
                    {gameState === "boot" && (
                      <div className="absolute inset-0 flex flex-col items-center justify-center animate-pulse z-0 bg-[#0f380f]">
                        <h1 className="text-[#9bbc0f] text-3xl font-black tracking-widest filter drop-shadow-sm">{BRAND_BOOT}</h1>
                      </div>
                    )}
                    {gameState === "avatar" && <AvatarScreen />}
                    {gameState === "game_select" && (
                      <div className="p-6 h-full flex flex-col bg-[#9bbc0f]">
                        <h2 className="text-[#0f380f] font-black text-center border-b-2 border-[#0f380f] pb-2 mb-4 uppercase text-sm">Select Cartridge</h2>
                        <div className="flex-1 flex flex-col justify-center gap-4">
                          <button onClick={() => startGame("csm")} onMouseEnter={() => { setMenuIndex(0); play("select"); }} className={`p-3 border-2 flex items-center gap-3 transition-all ${menuIndex === 0 ? "bg-[#0f380f] text-[#9bbc0f] border-[#0f380f]" : "border-[#0f380f] text-[#0f380f] bg-transparent"}`}>
                            <span className="font-bold">{menuIndex === 0 ? "►" : " "}</span>
                            <div className="text-left"><div className="text-xs font-black uppercase">CSM Quest</div><div className="text-[8px] uppercase">Survival Mode</div></div>
                          </button>
                          <button onClick={() => startGame("agent")} onMouseEnter={() => { setMenuIndex(1); play("select"); }} className={`p-3 border-2 flex items-center gap-3 transition-all ${menuIndex === 1 ? "bg-[#0f380f] text-[#9bbc0f] border-[#0f380f]" : "border-[#0f380f] text-[#0f380f] bg-transparent"}`}>
                            <span className="font-bold">{menuIndex === 1 ? "►" : " "}</span>
                            <div className="text-left"><div className="text-xs font-black uppercase">Legend Squad</div><div className="text-[8px] uppercase">Agentforce</div></div>
                          </button>
                        </div>
                      </div>
                    )}
                    {gameState === "game_intro" && (
                      <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#0f380f] z-20 overflow-hidden">
                        <div className="w-full h-2 bg-[#306230] mb-8"></div>
                        <h2 className="text-[#9bbc0f] font-black text-2xl tracking-widest animate-pulse text-center mb-2 uppercase">{currentGameType === "csm" ? "CSM QUEST" : "AGENTFORCE"}</h2>
                        <p className="text-[#306230] font-bold text-xs bg-[#9bbc0f] px-2 py-1 mb-8">MISSION 1 START</p>
                        <div className="animate-bounce">
                            {/* SVG spécifique selon le mode */}
                            <svg width="160" height="160" viewBox="0 0 100 100">
                                {currentGameType === 'csm' ? (
                                    <g>
                                        <g transform="translate(60, 40) rotate(15)"><path d="M 0 0 L 10 25 L -10 25 Z" fill="#9bbc0f" stroke="#8bac0f" strokeWidth="1" /><rect x="-10" y="25" width="20" height="20" fill="#9bbc0f" stroke="#8bac0f" strokeWidth="1" /><path d="M -10 45 L -15 55 L -10 50 Z" fill="#306230" stroke="#8bac0f" /><path d="M 10 45 L 15 55 L 10 50 Z" fill="#306230" stroke="#8bac0f" /><circle cx="0" cy="35" r="5" fill="#306230" /><path d="M -5 45 L 0 55 L 5 45 Z" fill="#8bac0f" className="animate-pulse" /></g>
                                        <g transform="translate(30, 60)"><ellipse cx="0" cy="0" rx="15" ry="14" fill="#9bbc0f" stroke="#8bac0f" strokeWidth="2" /><ellipse cx="-10" cy="12" rx="6" ry="4" fill="#306230" transform="rotate(-15 -10 12)" /><ellipse cx="10" cy="12" rx="6" ry="4" fill="#306230" transform="rotate(15 10 12)" /><ellipse cx="-14" cy="-2" rx="4" ry="4" fill="#9bbc0f" /><ellipse cx="14" cy="-5" rx="4" ry="4" fill="#9bbc0f" /><ellipse cx="-4" cy="-2" rx="1.5" ry="3" fill="#306230" /><ellipse cx="4" cy="-2" rx="1.5" ry="3" fill="#306230" /><path d="M -1 2 Q 0 4 1 2" stroke="#306230" strokeWidth="1" fill="none" /><ellipse cx="-8" cy="1" rx="2" ry="1" fill="#8bac0f" opacity="0.6" /><ellipse cx="8" cy="1" rx="2" ry="1" fill="#8bac0f" opacity="0.6" /></g>
                                    </g>
                                ) : (
                                    <g>
                                        <g transform="translate(50, 50)"><ellipse cx="0" cy="0" rx="18" ry="17" fill="#9bbc0f" stroke="#8bac0f" strokeWidth="2" /><ellipse cx="-10" cy="16" rx="7" ry="5" fill="#306230" transform="rotate(20 -10 16)" /><ellipse cx="10" cy="14" rx="7" ry="5" fill="#306230" transform="rotate(-10 10 14)" /><ellipse cx="-18" cy="-5" rx="5" ry="5" fill="#9bbc0f" /><ellipse cx="18" cy="-5" rx="5" ry="5" fill="#9bbc0f" /><path d="M -18 -5 Q 0 -25 18 -5" fill="#306230" stroke="#8bac0f" strokeWidth="1" opacity="0.8" /><rect x="-2" y="-25" width="4" height="10" fill="#8bac0f" stroke="#306230" strokeWidth="1" /><circle cx="0" cy="-28" r="3" fill="#9bbc0f" className="animate-ping" /><rect x="-10" y="-4" width="20" height="6" rx="2" fill="#306230" /><circle cx="-5" cy="-1" r="1.5" fill="#9bbc0f" /><circle cx="5" cy="-1" r="1.5" fill="#9bbc0f" /></g>
                                    </g>
                                )}
                            </svg>
                        </div>
                        <div className="w-full h-2 bg-[#306230] mt-8"></div>
                      </div>
                    )}
                    {gameState === "playing" && getCurrentScenario() && (
                      <div className="p-4 sm:p-6 h-full flex flex-col text-[#0f380f] z-0 relative">
                        <div className="flex justify-between items-center mb-2 border-b-2 border-[#0f380f] pb-2 shrink-0">
                          <div className="flex items-center gap-2"><div className="p-1 border-2 border-[#0f380f] rounded">{getCurrentScenario().icon}</div><span className="text-[10px] font-bold uppercase truncate font-mono">{getCurrentScenario().title}</span></div>
                          <div className="text-right"><span className="block text-[8px] font-black font-mono leading-tight opacity-70">MISSION {currentMissionIndex + 1}/{missions.length || 1}</span><span className="block text-[10px] font-black font-mono leading-tight">SCORE: {getSafeScore()}</span></div>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar pr-1">
                          <div className="bg-[#9bbc0f] p-3 rounded border-2 border-[#0f380f] mb-4 shadow-[inset_2px_2px_0px_rgba(0,0,0,0.1)]"><p className="text-sm font-bold font-sans leading-relaxed text-[#0f380f] tracking-normal">{getCurrentScenario().context}</p></div>
                          <div className="space-y-2 pb-4">
                            {getCurrentScenario().choices.map((c, idx) => (
                              <button key={c.id} disabled={loading} onClick={() => handleChoice(c)} onMouseEnter={() => { setChoiceIndex(idx); play("select"); }} className={`w-full text-left text-[11px] sm:text-xs font-sans p-2 border-2 transition-all font-bold group flex items-start gap-2 leading-tight ${choiceIndex === idx ? "bg-[#0f380f] text-[#9bbc0f] border-[#0f380f]" : "border-[#0f380f] hover:bg-[#0f380f] hover:text-[#9bbc0f]"}`}>
                                <span className="w-3 mt-[1px] font-mono">{choiceIndex === idx ? "►" : ""}</span><span>{c.label}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                        {loading && (<div className="absolute inset-0 bg-[#9bbc0f]/95 flex flex-col items-center justify-center z-50"><RotateCcw className="w-10 h-10 animate-spin text-[#0f380f]" /><span className="text-xs font-black mt-4 tracking-widest text-[#0f380f] font-mono">COMPUTING...</span></div>)}
                      </div>
                    )}
                    {gameState === "result" && feedback && (
                      <div className="p-4 sm:p-6 h-full flex flex-col text-[#0f380f] overflow-y-auto custom-scrollbar z-0 relative">
                        <div className="flex justify-between items-center mb-2 border-b-2 border-[#0f380f] pb-2"><span className="text-xs font-black underline">LOG REPORT</span><span className="text-xs font-black bg-[#0f380f] text-[#9bbc0f] px-2 rounded">TOTAL: {getSafeScore()}/100</span></div>
                        <div className="mb-4">
                          <p className="text-[11px] sm:text-xs leading-tight mb-2 italic font-bold">"{feedback.consequence}"</p>
                          <div className="flex gap-2 text-[10px] font-black justify-between"><span className="px-1 border border-[#0f380f] bg-white/30">{labels.s1}: {feedback.score1_impact > 0 ? "+" : ""}{feedback.score1_impact}</span><span className="px-1 border border-[#0f380f] bg-white/30">{labels.s2}: {feedback.score2_impact > 0 ? "+" : ""}{feedback.score2_impact}</span></div>
                        </div>
                        <div className="text-[10px] bg-[#8bac0f] p-2 border-2 border-[#0f380f] rounded mb-4 leading-tight shadow-[2px_2px_0px_#0f380f]"><strong className="block mb-1 underline">ANALYSIS:</strong> {feedback.coach_analysis}</div>
                        <button onClick={nextStep} onMouseEnter={() => play("select")} className="mt-auto w-full bg-[#0f380f] text-[#9bbc0f] text-xs font-black py-3 shadow-[2px_2px_0px_rgba(0,0,0,0.3)] hover:translate-y-[1px] hover:shadow-none transition-all">{currentMissionIndex === missions.length - 1 ? "FINISH GAME (Press A)" : "NEXT MISSION (Press A)"}</button>
                      </div>
                    )}
                    {gameState === "game_over" && <GameOverScreen />}
                  </div>
                  <div className="absolute bottom-3 left-8 w-full pointer-events-none">
                    <div className="flex items-center gap-2"><span className="text-[#3a3ab0] font-black italic text-lg sm:text-xl tracking-tighter drop-shadow-[1px_1px_0px_rgba(255,255,255,0.3)] bg-zinc-300/20 px-2 rounded-full border border-zinc-400/30">{BRAND_CONSOLE}</span></div>
                  </div>
                </div>
                {/* Contrôles physiques omis pour brévité dans le HTML unique mais présents dans le composant React complet */}
                <div className="flex justify-between items-end px-2 sm:px-4 mt-4">
                    <div className="relative w-24 h-24 sm:w-28 sm:h-28">
                        {/* D-PAD Visuel */}
                        <div className="absolute top-1/2 left-0 -translate-y-1/2 w-full h-8 sm:h-9 bg-[#333] rounded-sm shadow-[2px_2px_0px_#1a1a1a]"></div>
                        <div className="absolute left-1/2 top-0 -translate-x-1/2 w-8 sm:w-9 h-full bg-[#333] rounded-sm shadow-[2px_2px_0px_#1a1a1a]"></div>
                        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-[#333] z-10"><div className="w-6 h-6 rounded-full bg-[#252525] mx-auto mt-1 opacity-80 shadow-inner"></div></div>
                        {/* Zones tactiles D-PAD */}
                        <button className="absolute top-0 left-1/2 -translate-x-1/2 w-10 h-10 z-20 opacity-0 cursor-pointer" onClick={() => handleNav("up")}></button>
                        <button className="absolute bottom-0 left-1/2 -translate-x-1/2 w-10 h-10 z-20 opacity-0 cursor-pointer" onClick={() => handleNav("down")}></button>
                        <button className="absolute left-0 top-1/2 -translate-y-1/2 w-10 h-10 z-20 opacity-0 cursor-pointer" onClick={() => handleNav("left")}></button>
                        <button className="absolute right-0 top-1/2 -translate-y-1/2 w-10 h-10 z-20 opacity-0 cursor-pointer" onClick={() => handleNav("right")}></button>
                        <div className="absolute top-2 left-1/2 -translate-x-1/2 text-[#111] text-[10px] pointer-events-none">▲</div>
                        <div className="absolute bottom-2 left-1/2 -translate-x-1/2 text-[#111] text-[10px] pointer-events-none">▼</div>
                        <div className="absolute left-2 top-1/2 -translate-y-1/2 text-[#111] text-[10px] pointer-events-none">◀</div>
                        <div className="absolute right-2 top-1/2 -translate-y-1/2 text-[#111] text-[10px] pointer-events-none">▶</div>
                    </div>
                    <div className="flex gap-4 sm:gap-6 rotate-[-15deg] mb-4 sm:mb-8 pr-2">
                        <div className="flex flex-col items-center gap-2 group cursor-pointer">
                            <button onClick={handleB} className="w-10 h-10 sm:w-12 sm:h-12 bg-[#8b3a3a] rounded-full border-b-4 border-r-4 border-[#5e2626] active:translate-y-1 active:border-b-0 active:border-r-0 active:shadow-inner shadow-xl flex items-center justify-center transition-all hover:bg-[#a64444]"></button>
                            <span className="font-black text-[#8b3a3a] text-xs sm:text-sm tracking-widest group-hover:text-red-600">B</span>
                        </div>
                        <div className="flex flex-col items-center gap-2 mt-4 sm:mt-6 group cursor-pointer">
                            <button onClick={handleA} className="w-10 h-10 sm:w-12 sm:h-12 bg-[#8b3a3a] rounded-full border-b-4 border-r-4 border-[#5e2626] active:translate-y-1 active:border-b-0 active:border-r-0 active:shadow-inner shadow-xl flex items-center justify-center transition-all hover:bg-[#a64444]"></button>
                            <span className="font-black text-[#8b3a3a] text-xs sm:text-sm tracking-widest group-hover:text-red-600">A</span>
                        </div>
                    </div>
                </div>
                <div className="flex justify-center gap-6 sm:gap-8 mt-8 sm:mt-12 mb-4">
                    <div className="flex flex-col items-center"><button className="w-12 h-3 sm:w-14 sm:h-4 bg-[#666] rotate-[-25deg] rounded-full border border-gray-700 shadow-inner active:opacity-50 active:scale-95 transition-transform"></button><span className="text-[8px] sm:text-[10px] font-black text-[#888] mt-2 tracking-widest uppercase">Select</span></div>
                    <div className="flex flex-col items-center"><button onClick={handleA} className="w-12 h-3 sm:w-14 sm:h-4 bg-[#666] rotate-[-25deg] rounded-full border border-gray-700 shadow-inner active:opacity-50 active:scale-95 transition-transform"></button><span className="text-[8px] sm:text-[10px] font-black text-[#888] mt-2 tracking-widest uppercase">Start</span></div>
                </div>
                <div className="absolute right-8 bottom-8 flex gap-2 rotate-[-15deg] opacity-50">{[...Array(6)].map((_, i) => (<div key={i} className="w-2 h-10 sm:h-12 bg-[#999] rounded-full shadow-[inset_1px_1px_2px_rgba(0,0,0,0.5)]"></div>))}</div>
                <div className="absolute -top-3 left-8 w-16 h-6 bg-[#D1D1D1] rounded-t-lg border-t border-l border-r border-white/50 flex items-end justify-center pb-1">
                    <button onClick={handlePower} className="w-10 h-4 bg-gray-400 rounded-sm border border-gray-500 shadow-inner hover:bg-gray-300 active:bg-gray-500 flex items-center justify-center group transition-all" title="Power Switch"><div className="flex gap-[2px]"><div className="w-[2px] h-2 bg-gray-500/50 rounded-full"></div><div className="w-[2px] h-2 bg-gray-500/50 rounded-full"></div><div className="w-[2px] h-2 bg-gray-500/50 rounded-full"></div></div></button>
                    <span className="absolute -top-4 left-1/2 -translate-x-1/2 text-[8px] font-black text-zinc-400 uppercase tracking-widest flex items-center gap-1"><Power size={8} /> On/Off</span>
                </div>
              </div>
              <div className="fixed bottom-4 left-1/2 -translate-x-1/2 text-center w-full pointer-events-none z-50">
                <p className="inline-block text-[#2e004b] text-[10px] sm:text-xs font-black italic uppercase tracking-[0.2em] font-sans bg-gradient-to-r from-[#8B5CF680] via-[#EC489980] to-[#3B82F680] px-6 py-2 rounded-full border-2 border-white/30 shadow-[0_0_20px_rgba(139,92,246,0.4)] transform -rotate-1 backdrop-blur-sm">{BRAND_FOOTER}</p>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
